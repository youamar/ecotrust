name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ecotrust:ci .
      - name: Smoke-test container
        run: |
          docker run -d --name ecotrust-ci -p 8000:8000 ecotrust:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fs http://localhost:8000/healthz
          curl -fs http://localhost:8000/rooms | head -c 200
          docker rm -f ecotrust-ci
