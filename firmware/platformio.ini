; EcoTrust Edge Node — PlatformIO config
; Hardware (slide 10 BOM):
;   - VL53L5CX 8x8 ToF (RM 280)
;   - ESP32-WROOM-32 gateway (RM 60)
;   - 16A smart relay (RM 90)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.4
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8       ; MQTT (production transport, slide 10)
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32  ; TFLite-Micro for ESP32

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Override these via build env or secrets.h
    -DECOTRUST_API="\"http://192.168.1.100:8000\""
    -DECOTRUST_ROOM_ID=1
